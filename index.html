<body>
<header class="site-header"><div class="container header-inner"><a href="#home" class="logo" aria-label="Portfolio 首页"><span class="logo-mark"></span>portfolio<span class="accent">®</span></a><nav class="nav" id="nav"><a href="#work" id="navWork"></a><a href="#philosophy" id="navApproach"></a><a href="#about" id="navAbout"></a><a href="#contact" id="navContact"></a><span class="status mono"><i class="dot"></i><span id="navStatus"></span></span></nav><button class="menu-toggle" id="menuToggle" aria-label="打开导航菜单" aria-expanded="false">☰</button></div></header>
<main>
<section class="hero" id="home"><div class="hero-grid"></div><canvas id="artCanvas" aria-hidden="true"></canvas><div class="container hero-content"><div class="hero-topline mono"><span id="heroTopLeft"></span><span id="heroTopRight"></span></div><h1 class="hero-title"><span id="heroTitleBefore"></span><span class="outline" id="heroTitleOutline"></span><span id="heroTitleAfter"></span><span class="accent">.</span></h1><div class="hero-lower"><div class="hero-caption" id="heroCaption"></div><div class="mono" id="heroEdition"></div></div></div><div class="side-vert mono" id="heroSide"></div><div class="container hero-bottom"><div class="scroll-cue mono"><span class="down-arrow">↓</span><span id="heroScroll"></span></div><div class="mono muted" id="heroBottom"></div></div></section>

<section class="contact" id="contact"><div class="container"><div class="eyebrow mono muted reveal" id="contactEyebrow"></div><div class="contact-heading reveal"><a id="contactTitleLink"><span id="contactTitle"></span></a></div><div class="contact-foot reveal"><p class="contact-lead" id="contactLead"></p><div><div class="mono muted" style="margin-bottom:14px" id="contactElsewhere"></div><div class="socials mono"><a id="emailLink"></a><a id="behanceLink" target="_blank" rel="noopener"></a><a id="instagramLink" target="_blank" rel="noopener"></a></div></div></div></div></section>
</main>

<script>

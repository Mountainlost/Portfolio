.hero-art{overflow:hidden;isolation:isolate}.hero-art img{animation:none!important;transform:scale(1.045);transition:opacity .55s ease,transform 1.2s ease}.hero-art canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .65s ease;pointer-events:none;transform:scale(1.012)}.hero-art.motion-ready canvas{opacity:1}.hero-art.motion-ready img{opacity:0}.hero-art:before{content:"";position:absolute;inset:-20%;z-index:2;pointer-events:none;background:radial-gradient(circle at var(--glow-x,68%) var(--glow-y,42%),rgba(214,201,255,.13),transparent 18%),radial-gradient(circle at calc(var(--glow-x,68%) + 10%) calc(var(--glow-y,42%) + 6%),rgba(255,198,122,.08),transparent 15%);mix-blend-mode:screen;filter:blur(12px);animation:heroSheen 10s ease-in-out infinite alternate}.hero-art:after{z-index:3!important}@keyframes heroSheen{from{transform:translate3d(-1.5%,-1%,0) scale(1)}to{transform:translate3d(2%,1.5%,0) scale(1.04)}}

<header class="site-header">

<script>
(()=>{

<style>

/* Portfolio Studio: hero media + direct-manipulation editing */
.hero-media{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#050506}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;opacity:.92;filter:saturate(.9) contrast(1.04)}
.hero:after{z-index:1;background:linear-gradient(90deg,rgba(11,11,13,.48) 0%,rgba(11,11,13,.20) 42%,rgba(11,11,13,.05) 72%,rgba(11,11,13,.24) 100%),linear-gradient(180deg,rgba(11,11,13,.18) 0%,transparent 55%,rgba(11,11,13,.62) 100%)}
[data-edit-key]{--edit-x:0px;--edit-y:0px;translate:var(--edit-x) var(--edit-y)}
body.edit-preview .hero-content{pointer-events:auto}
body.edit-preview [data-edit-key]{cursor:move;position:relative;z-index:6;outline:1px solid transparent;outline-offset:5px;transition:outline-color .12s,background-color .12s}
body.edit-preview [data-edit-key]:hover{outline-color:rgba(217,255,85,.5);background:rgba(217,255,85,.035)}
body.edit-preview [data-edit-key].studio-selected{outline:1px solid var(--acid);background:rgba(217,255,85,.055)}
body.edit-preview.studio-dragging,body.edit-preview.studio-dragging *{cursor:grabbing!important;user-select:none!important}
.studio-guide{display:none;position:fixed;z-index:9998;pointer-events:none;background:var(--acid);opacity:.72;box-shadow:0 0 8px rgba(217,255,85,.35)}
.studio-guide.v{top:0;bottom:0;width:1px}
.studio-guide.h{left:0;right:0;height:1px}
body.edit-preview .studio-guide.show{display:block}
@media(max-width:720px){.hero-media img{object-position:63% center}.hero:after{background:linear-gradient(90deg,rgba(11,11,13,.68),rgba(11,11,13,.2) 75%),linear-gradient(180deg,rgba(11,11,13,.08),rgba(11,11,13,.68))}}

</style>

<body>
<header class="site-header"><div class="container header-inner"><a href="#home" class="logo" aria-label="Portfolio 首页"><span class="logo-mark"></span>portfolio<span class="accent">®</span></a><nav class="nav" id="nav"><a href="#work" id="navWork" data-edit-key="nav.work"></a><a href="#philosophy" id="navApproach" data-edit-key="nav.approach"></a><a href="#about" id="navAbout" data-edit-key="nav.about"></a><a href="#contact" id="navContact" data-edit-key="nav.contact"></a><span class="status mono"><i class="dot"></i><span id="navStatus" data-edit-key="nav.status"></span></span></nav><button class="menu-toggle" id="menuToggle" aria-label="打开导航菜单" aria-expanded="false">☰</button></div></header>
<main>
<section class="hero" id="home"><div class="hero-media" aria-hidden="true"><img id="heroImage" src="assets/hero-art.webp" alt=""></div><div class="container hero-content"><div class="hero-topline mono"><span id="heroTopLeft" data-edit-key="hero.topLeft"></span><span id="heroTopRight" data-edit-key="hero.topRight"></span></div><h1 class="hero-title"><span id="heroTitleBefore" data-edit-key="hero.titleBefore"></span><span class="outline" id="heroTitleOutline" data-edit-key="hero.titleOutline"></span><span id="heroTitleAfter" data-edit-key="hero.titleAfter"></span><span class="accent">.</span></h1><div class="hero-lower"><div class="hero-caption" id="heroCaption" data-edit-key="hero.caption"></div><div class="mono" id="heroEdition" data-edit-key="hero.edition"></div></div></div><div class="side-vert mono" id="heroSide" data-edit-key="hero.side"></div><div class="container hero-bottom"><div class="scroll-cue mono"><span class="down-arrow">↓</span><span id="heroScroll" data-edit-key="hero.scroll"></span></div><div class="mono muted" id="heroBottom" data-edit-key="hero.bottom"></div></div></section>
<div class="ticker" aria-hidden="true"><div class="ticker-inner" id="ticker"></div></div>
<section class="section-pad" id="work"><div class="container"><div class="section-head reveal"><div><div class="eyebrow mono muted" id="workEyebrow" data-edit-key="work.eyebrow"></div><h2 id="workTitle" data-edit-key="work.title"></h2></div><p class="section-intro" id="workIntro" data-edit-key="work.intro"></p></div><div class="filters reveal" role="group" aria-label="作品类别筛选" id="filters"></div><div class="work-grid" id="workGrid"></div></div></section>
<section class="manifesto section-pad" id="philosophy"><div class="container manifesto-grid"><div class="eyebrow mono muted reveal" id="philosophyEyebrow" data-edit-key="philosophy.eyebrow"></div><div class="reveal"><p class="statement"><span id="philosophyLine1" data-edit-key="philosophy.line1"></span><br><em id="philosophyLine2" data-edit-key="philosophy.line2"></em><br><span class="accent" id="philosophyLine3" data-edit-key="philosophy.line3"></span></p><div class="manifesto-bottom"><p id="philosophyBody" data-edit-key="philosophy.body"></p><span class="asterisk" aria-hidden="true">✳</span></div></div></div></section>
<section class="section-pad" id="expertise"><div class="container capabilities-grid"><div class="reveal"><div class="eyebrow mono muted" id="expertiseEyebrow" data-edit-key="expertise.eyebrow"></div><h2 style="margin-top:35px" id="expertiseTitle" data-edit-key="expertise.title"></h2><p class="section-intro" style="margin-top:35px" id="expertiseIntro" data-edit-key="expertise.intro"></p></div><div class="cap-list reveal" id="expertiseList"></div></div></section>
<section class="about section-pad" id="about"><div class="container about-wrap"><div class="about-copy reveal"><div class="eyebrow mono" id="aboutEyebrow" data-edit-key="about.eyebrow"></div><p class="large" id="aboutTitle" data-edit-key="about.title"></p><p id="aboutBody" data-edit-key="about.body"></p><div class="about-index mono"><span id="aboutNoteLeft" data-edit-key="about.noteLeft"></span><span id="aboutNoteRight" data-edit-key="about.noteRight"></span></div></div><div class="about-object reveal" aria-label="旋转的抽象环形雕塑"><svg viewBox="0 0 600 600" role="img" aria-label="抽象几何环形雕塑"><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a0b"/><stop offset=".19" stop-color="#797d70"/><stop offset=".34" stop-color="#ecf8b5"/><stop offset=".49" stop-color="#21281b"/><stop offset=".67" stop-color="#a0b167"/><stop offset=".83" stop-color="#252e1c"/><stop offset="1" stop-color="#030402"/></linearGradient></defs><g transform="translate(300 300) rotate(-30)"><ellipse rx="235" ry="155" fill="none" stroke="url(#metal)" stroke-width="100"/><ellipse rx="235" ry="155" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/><ellipse rx="235" ry="155" fill="none" stroke="#111" stroke-opacity=".36" stroke-width="20" transform="translate(12 8)"/></g><circle cx="300" cy="300" r="8" fill="#111"/></svg></div></div></section>
<section class="contact" id="contact"><div class="container"><div class="eyebrow mono muted reveal" id="contactEyebrow" data-edit-key="contact.eyebrow"></div><div class="contact-heading reveal"><a id="contactTitleLink"><span id="contactTitle" data-edit-key="contact.title"></span></a></div><div class="contact-foot reveal"><p class="contact-lead" id="contactLead" data-edit-key="contact.lead"></p><div><div class="mono muted" style="margin-bottom:14px" id="contactElsewhere" data-edit-key="contact.elsewhere"></div><div class="socials mono"><a id="emailLink" data-edit-key="contact.emailLabel"></a><a id="behanceLink" data-edit-key="contact.behanceLabel" target="_blank" rel="noopener"></a><a id="instagramLink" data-edit-key="contact.instagramLabel" target="_blank" rel="noopener"></a></div></div></div></div></section>
</main>
<footer class="footer"><div class="container footer-inner mono"><span id="footerLeft" data-edit-key="footer.left"></span><span id="footerCenter" data-edit-key="footer.center"></span><a class="backtotop" href="#home" id="footerTop" data-edit-key="footer.top"></a></div></footer>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-hidden="true"><div class="dialog-panel"><button class="dialog-close" id="dialogClose" aria-label="关闭项目详情">×</button><div class="dialog-num mono">精选作品 / <span id="dialogIndex">01</span></div><h3 id="dialogTitle"></h3><p id="dialogDesc"></p><div class="dialog-tags" id="dialogTags"></div><div class="dialog-bottom mono"><span id="dialogYear"></span><span class="accent">项目详情 ↗</span></div></div></div>

<script>
(()=>{
  'use strict';
  const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];
  const previewMode=new URLSearchParams(location.search).get('preview')==='1';
  let content=structuredClone(window.PORTFOLIO_CONTENT||{}), previousFocus=null, currentFilter='all', selectedKey='';
  const nl=s=>escapeHtml(String(s||'')).replace(/\n/g,'<br>');
  const text=(id,v)=>{const el=$('#'+id); if(el) el.textContent=v??''};
  const getPath=(obj,path)=>String(path||'').split('.').reduce((o,k)=>o?.[k],obj);
  function ensureDesign(){
    content.design ||= {};
    content.design.heroImage ||= 'assets/hero-art.webp';
    content.design.elementStyles ||= {};
    content.design.elementOffsets ||= {};
  }
  function applyContent(c){
    content=structuredClone(c); ensureDesign();
    document.title=c.meta.title;
    document.querySelector('meta[name="description"]').content=c.meta.description;
    text('navWork',c.nav.work); text('navApproach',c.nav.approach); text('navAbout',c.nav.about); text('navContact',c.nav.contact+' ↗'); text('navStatus',c.nav.status);
    $('#heroTopLeft').innerHTML=nl(c.hero.topLeft); $('#heroTopRight').innerHTML=nl(c.hero.topRight);
    text('heroTitleBefore',c.hero.titleBefore); text('heroTitleOutline',c.hero.titleOutline); text('heroTitleAfter',c.hero.titleAfter);
    const cap=String(c.hero.caption||''), ac=String(c.hero.captionAccent||'');
    if(ac&&cap.includes(ac)){const i=cap.indexOf(ac); $('#heroCaption').innerHTML=escapeHtml(cap.slice(0,i))+`<span>${escapeHtml(ac)}</span>`+escapeHtml(cap.slice(i+ac.length))} else $('#heroCaption').textContent=cap;
    $('#heroEdition').innerHTML=nl(c.hero.edition); text('heroSide',c.hero.side); text('heroScroll',c.hero.scroll); text('heroBottom',c.hero.bottom);
    $('#ticker').innerHTML=Array.from({length:4},()=>`<span>${c.ticker.map(x=>`${escapeHtml(x)} <i></i>`).join(' ')}</span>`).join('');
    text('workEyebrow',c.work.eyebrow); text('workTitle',c.work.title); text('workIntro',c.work.intro); renderFilters(c); renderProjects(c);
    text('philosophyEyebrow',c.philosophy.eyebrow); text('philosophyLine1',c.philosophy.line1); text('philosophyLine2',c.philosophy.line2); text('philosophyLine3',c.philosophy.line3); text('philosophyBody',c.philosophy.body);
    text('expertiseEyebrow',c.expertise.eyebrow); text('expertiseTitle',c.expertise.title); text('expertiseIntro',c.expertise.intro);
    $('#expertiseList').innerHTML=c.expertise.items.map((x,i)=>`<div class="cap-row"><span class="mono muted">${String(i+1).padStart(2,'0')}</span><h3 data-edit-key="expertise.items.${i}">${escapeHtml(x)}</h3><span class="plus">↗</span></div>`).join('');
    text('aboutEyebrow',c.about.eyebrow); text('aboutTitle',c.about.title); text('aboutBody',c.about.body); text('aboutNoteLeft',c.about.noteLeft); text('aboutNoteRight',c.about.noteRight);
    text('contactEyebrow',c.contact.eyebrow); text('contactTitle',c.contact.title); text('contactLead',c.contact.lead); text('contactElsewhere',c.contact.elsewhere); text('emailLink',c.contact.emailLabel); text('behanceLink',c.contact.behanceLabel); text('instagramLink',c.contact.instagramLabel);
    $('#emailLink').href='mailto:'+c.contact.email; $('#contactTitleLink').href='mailto:'+c.contact.email+'?subject='+encodeURIComponent('项目合作'); $('#behanceLink').href=c.contact.behance; $('#instagramLink').href=c.contact.instagram;
    text('footerLeft',c.footer.left); text('footerCenter',c.footer.center); text('footerTop',c.footer.top);
    applyDesign(); observeReveals(); restoreSelection();
  }
  function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
  function renderFilters(c){
    const f=c.work.filters, counts={identity:c.projects.filter(p=>p.category==='identity').length,digital:c.projects.filter(p=>p.category==='digital').length,experimental:c.projects.filter(p=>p.category==='experimental').length};
    $('#filters').innerHTML=`<button class="filter ${currentFilter==='all'?'active':''}" data-filter="all">${escapeHtml(f.all)} (${String(c.projects.length).padStart(2,'0')})</button><button class="filter ${currentFilter==='identity'?'active':''}" data-filter="identity">${escapeHtml(f.identity)} (${String(counts.identity).padStart(2,'0')})</button><button class="filter ${currentFilter==='digital'?'active':''}" data-filter="digital">${escapeHtml(f.digital)} (${String(counts.digital).padStart(2,'0')})</button><button class="filter ${currentFilter==='experimental'?'active':''}" data-filter="experimental">${escapeHtml(f.experimental)} (${String(counts.experimental).padStart(2,'0')})</button>`;
    $$('.filter').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.filter;renderFilters(content);filterProjects()}));
  }
  function filterProjects(){$$('.project').forEach(p=>p.hidden=currentFilter!=='all'&&p.dataset.category!==currentFilter)}
  function renderProjects(c){
    $('#workGrid').innerHTML=c.projects.map((p,i)=>`<article class="project reveal" tabindex="0" role="button" data-category="${escapeHtml(p.category)}" data-id="${i}" aria-label="查看 ${escapeHtml(p.name)} 项目"><div class="project-art"><img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.alt||p.name)}" loading="lazy"><div class="project-overlay"><span class="project-go">↗</span></div></div><div class="project-meta"><div><div class="project-name" data-edit-key="projects.${i}.name">${escapeHtml(p.name)}</div><div class="project-type mono" data-edit-key="projects.${i}.type">${escapeHtml(p.type)}</div></div><span class="project-year mono" data-edit-key="projects.${i}.year">${escapeHtml(p.year)}</span></div></article>`).join('');
    $$('.project').forEach(p=>{p.addEventListener('click',()=>{if(!previewMode)openProject(+p.dataset.id)});p.addEventListener('keydown',e=>{if(!previewMode&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openProject(+p.dataset.id)}})}); filterProjects();
  }
  function applyDesign(){
    ensureDesign();
    const hero=$('#heroImage'); if(hero && hero.getAttribute('src')!==content.design.heroImage) hero.src=content.design.heroImage;
    $$('[data-edit-key]').forEach(el=>{
      const key=el.dataset.editKey, st=content.design.elementStyles[key]||{}, off=content.design.elementOffsets[key]||{};
      el.style.fontFamily=st.fontFamily||'';
      el.style.fontSize=Number.isFinite(+st.fontSize)&&st.fontSize!==''?`${+st.fontSize}px`:'';
      el.style.lineHeight=st.lineHeight!==undefined&&st.lineHeight!==''?String(st.lineHeight):'';
      el.style.letterSpacing=Number.isFinite(+st.letterSpacing)&&st.letterSpacing!==''?`${+st.letterSpacing}px`:'';
      el.style.setProperty('--edit-x',`${+off.x||0}px`); el.style.setProperty('--edit-y',`${+off.y||0}px`);
    });
  }
  function openProject(i){const d=$('#dialog'),p=content.projects[i];previousFocus=document.activeElement;text('dialogIndex',String(i+1).padStart(2,'0'));text('dialogTitle',p.name);text('dialogDesc',p.description);text('dialogYear',p.year);$('#dialogTags').replaceChildren(...p.tags.map(t=>{const s=document.createElement('span');s.textContent=t;return s}));d.classList.add('open');d.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('#dialogClose').focus()}
  function closeProject(){const d=$('#dialog');d.classList.remove('open');d.setAttribute('aria-hidden','true');document.body.style.overflow='';previousFocus?.focus()}
  const io='IntersectionObserver'in window?new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12}):null;
  function observeReveals(){$$('.reveal').forEach(el=>{if(!el.dataset.observed){el.dataset.observed='1';io?io.observe(el):el.classList.add('visible')}})}
  applyContent(content);
  const menu=$('#menuToggle'),nav=$('#nav'); menu.addEventListener('click',()=>{let open=nav.classList.toggle('show');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'×':'☰'}); $$('.nav a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('show');menu.textContent='☰';menu.setAttribute('aria-expanded','false')}));
  $('#dialogClose').addEventListener('click',closeProject); $('#dialog').addEventListener('click',e=>{if(e.target.id==='dialog')closeProject()}); document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#dialog').classList.contains('open'))closeProject()});
  window.addEventListener('message',e=>{if(e.data?.type==='portfolio-preview'&&e.data.content)applyContent(e.data.content)});

  // Direct manipulation is enabled only inside studio.html preview.
  if(previewMode){
    document.body.classList.add('edit-preview');
    const gv=document.createElement('div'), gh=document.createElement('div'); gv.className='studio-guide v';gh.className='studio-guide h';document.body.append(gv,gh);
    let drag=null;
    function restoreSelection(){if(!selectedKey)return;const el=document.querySelector(`[data-edit-key="${CSS.escape(selectedKey)}"]`);if(el)el.classList.add('studio-selected')}
    window.restoreSelection=restoreSelection;
    function selectElement(el){
      $$('.studio-selected').forEach(x=>x.classList.remove('studio-selected')); el.classList.add('studio-selected'); selectedKey=el.dataset.editKey;
      const cs=getComputedStyle(el), off=content.design.elementOffsets[selectedKey]||{x:0,y:0};
      const fontSize=parseFloat(cs.fontSize)||16, lineHeightPx=cs.lineHeight==='normal'?fontSize*1.2:(parseFloat(cs.lineHeight)||fontSize*1.2);
      parent.postMessage({type:'portfolio-select',key:selectedKey,value:getPath(content,selectedKey)??el.textContent,style:{fontFamily:cs.fontFamily,fontSize,lineHeight:lineHeightPx,letterSpacing:parseFloat(cs.letterSpacing)||0},offset:{x:+off.x||0,y:+off.y||0}},'*');
    }
    function getSnapTargets(active){
      const xs=[],ys=[]; const addRect=r=>{xs.push(r.left,(r.left+r.right)/2,r.right);ys.push(r.top,(r.top+r.bottom)/2,r.bottom)};
      const container=$('.container')?.getBoundingClientRect(); if(container)addRect(container);
      xs.push(innerWidth/2); ys.push(innerHeight/2);
      $$('[data-edit-key]').filter(x=>x!==active).forEach(x=>addRect(x.getBoundingClientRect()));
      return {xs,ys};
    }
    function snapAxis(lines,targets,threshold=6){let best={d:Infinity,delta:0,guide:null};for(const line of lines)for(const t of targets){const d=t-line;if(Math.abs(d)<Math.abs(best.d)&&Math.abs(d)<=threshold)best={d,delta:d,guide:t}}return best}
    function hideGuides(){gv.classList.remove('show');gh.classList.remove('show')}
    document.addEventListener('pointerdown',e=>{
      const el=e.target.closest('[data-edit-key]'); if(!el)return;
      e.preventDefault();e.stopPropagation();selectElement(el);
      const off=content.design.elementOffsets[el.dataset.editKey]||{x:0,y:0}; drag={el,key:el.dataset.editKey,startX:e.clientX,startY:e.clientY,baseX:+off.x||0,baseY:+off.y||0,rect:el.getBoundingClientRect(),targets:getSnapTargets(el),id:e.pointerId,moved:false};
      try{el.setPointerCapture(e.pointerId)}catch{}
      document.body.classList.add('studio-dragging');
    },true);
    document.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==drag.id)return;
      const rawDx=e.clientX-drag.startX,rawDy=e.clientY-drag.startY;if(Math.abs(rawDx)+Math.abs(rawDy)>2)drag.moved=true;
      let x=Math.round((drag.baseX+rawDx)/8)*8,y=Math.round((drag.baseY+rawDy)/8)*8;
      const shiftX=x-drag.baseX, shiftY=y-drag.baseY, r=drag.rect;
      const sx=snapAxis([r.left+shiftX,(r.left+r.right)/2+shiftX,r.right+shiftX],drag.targets.xs);
      const sy=snapAxis([r.top+shiftY,(r.top+r.bottom)/2+shiftY,r.bottom+shiftY],drag.targets.ys);
      if(sx.guide!==null){x+=sx.delta;gv.style.left=sx.guide+'px';gv.classList.add('show')}else gv.classList.remove('show');
      if(sy.guide!==null){y+=sy.delta;gh.style.top=sy.guide+'px';gh.classList.add('show')}else gh.classList.remove('show');
      content.design.elementOffsets[drag.key]={x:Math.round(x),y:Math.round(y)};
      drag.el.style.setProperty('--edit-x',`${Math.round(x)}px`);drag.el.style.setProperty('--edit-y',`${Math.round(y)}px`);
      parent.postMessage({type:'portfolio-layout-change',key:drag.key,offset:{x:Math.round(x),y:Math.round(y)}},'*');
    },true);
    document.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;hideGuides();document.body.classList.remove('studio-dragging');try{drag.el.releasePointerCapture(e.pointerId)}catch{}drag=null},true);
    document.addEventListener('click',e=>{const el=e.target.closest('[data-edit-key]');if(el){e.preventDefault();e.stopPropagation();selectElement(el)}},true);
    window.addEventListener('message',e=>{if(e.data?.type==='portfolio-select-key'){selectedKey=e.data.key||'';restoreSelection()}});
  }
  function restoreSelection(){if(!previewMode||!selectedKey)return;const el=document.querySelector(`[data-edit-key="${CSS.escape(selectedKey)}"]`);if(el){$$('.studio-selected').forEach(x=>x.classList.remove('studio-selected'));el.classList.add('studio-selected')}}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio Studio</title>
<style>
:root{--bg:#0d0d0f;--panel:#151518;--panel2:#1b1b1f;--text:#f1f0eb;--muted:#8e8e95;--line:#303035;--acid:#d9ff55;--danger:#ff756d;--blue:#8db8ff;--r:12px}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#101012;gap:10px}.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:750;white-space:nowrap}.brand i{width:12px;height:12px;border:3px solid var(--acid);border-radius:50%;display:block}.brand small{color:#777;font-weight:500}.top-actions,.history-actions{display:flex;align-items:center;gap:7px}.button{border:1px solid var(--line);background:#1a1a1e;color:var(--text);padding:9px 12px;border-radius:8px;font-size:12px;font-weight:650}.button:hover{border-color:#555}.button:disabled{opacity:.38;cursor:not-allowed}.button.primary{background:var(--acid);color:#101113;border-color:var(--acid)}.button.danger{border-color:#57302d;color:#ffaaa4;background:#1b1111}.button.ghost{background:transparent}.button.icon{width:34px;padding:8px 0}.save-state{font-size:11px;color:var(--muted);margin-right:3px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layout{height:calc(100% - 58px);display:grid;grid-template-columns:minmax(0,1.65fr) minmax(390px,.72fr)}.preview{min-width:0;background:#050505;display:flex;flex-direction:column;position:relative}.preview-tools{min-height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#121215;gap:8px}.canvas-tools{display:flex;align-items:center;gap:6px;min-width:0}.canvas-label{font-size:10px;color:var(--muted);margin-right:4px;white-space:nowrap}.mini{border:1px solid #34343a;background:#1a1a1e;color:#c7c7cb;border-radius:7px;padding:6px 8px;font-size:10px}.mini:hover{color:var(--acid);border-color:#59642a}.section-select{border:1px solid #34343a;background:#151518;color:#aaa;border-radius:7px;padding:5px 7px;font-size:10px;max-width:105px}.viewport{display:flex;gap:5px}.viewport button{background:#1b1b1e;border:1px solid var(--line);color:#aaa;padding:6px 9px;border-radius:7px;font-size:10px}.viewport button.active{color:#111;background:var(--text);border-color:var(--text)}.frame-wrap{flex:1;display:flex;justify-content:center;min-height:0;overflow:auto;background:repeating-conic-gradient(#111 0 25%,#0d0d0f 0 50%) 0/20px 20px;padding:10px}.frame-shell{width:100%;height:100%;background:#0b0b0d;box-shadow:0 12px 50px rgba(0,0,0,.45);transition:width .2s;border-radius:3px;overflow:hidden}.frame-shell.mobile{width:390px;max-width:100%}.frame-shell.tablet{width:820px;max-width:100%}iframe{border:0;width:100%;height:100%;background:#0b0b0d}.editor{border-left:1px solid var(--line);background:var(--panel);overflow:auto}.editor-head{position:sticky;top:0;z-index:4;background:rgba(21,21,24,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 16px}.editor-head h1{font-size:15px;margin:0 0 5px}.editor-head p{font-size:10.5px;line-height:1.55;color:var(--muted);margin:0}.form{padding:11px 12px 80px}.group{border:1px solid var(--line);border-radius:var(--r);background:#121215;margin-bottom:9px;overflow:hidden}.group summary{list-style:none;padding:14px;cursor:pointer;font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center}.group summary::-webkit-details-marker{display:none}.group summary:after{content:'＋';font-weight:400;color:var(--muted)}.group[open] summary:after{content:'－'}.group-body{padding:0 14px 15px;border-top:1px solid var(--line)}.hint{font-size:10.5px;color:var(--muted);line-height:1.65;margin:11px 0}.field{margin-top:13px}.field label{display:block;font-size:10.5px;color:#b8b8bd;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0d0d10;color:var(--text);border-radius:8px;padding:9px 10px;outline:none;font-size:12px;line-height:1.5}.field textarea{min-height:74px;resize:vertical}.field input[type="color"]{height:38px;padding:4px}.field input[type="checkbox"]{width:auto;accent-color:var(--acid)}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--acid);box-shadow:0 0 0 2px rgba(217,255,85,.07)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row.three{grid-template-columns:1fr 1fr 1fr}.triple{display:grid;grid-template-columns:1.15fr 1fr .8fr;gap:8px}.project-card{margin-top:12px;padding:12px;border:1px solid #29292e;background:#0f0f12;border-radius:10px}.project-card h3{font-size:11px;margin:0 0 9px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#d7d7db}.project-card h3 button{border:0;background:none;color:#7f7f85;font-size:10px}.project-card h3 button:hover{color:var(--danger)}.image-control{display:grid;grid-template-columns:74px 1fr;gap:9px;align-items:center}.thumb{width:74px;height:56px;object-fit:cover;background:#25252a;border-radius:7px;border:1px solid #303036}.upload-label{display:flex;align-items:center;justify-content:center;border:1px dashed #45454c;border-radius:8px;padding:9px;color:#c2c2c8;font-size:10.5px;cursor:pointer;background:#15151a;text-align:center}.upload-label:hover{border-color:var(--acid);color:var(--acid)}.upload-label input{display:none}.publish-note{font-size:10.5px;color:var(--muted);line-height:1.7;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#101013;margin:10px 0 0}.publish-note b{color:var(--text)}.selection-panel{border:1px solid #4b522d;border-radius:var(--r);background:linear-gradient(180deg,rgba(217,255,85,.07),rgba(217,255,85,.015));margin-bottom:9px;overflow:hidden}.selection-head{padding:12px 13px 10px;border-bottom:1px solid rgba(217,255,85,.18);display:flex;align-items:start;justify-content:space-between;gap:10px}.selection-head b{font-size:12px}.selection-head span{font-size:9.5px;color:var(--acid);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;text-align:right}.selection-body{padding:0 13px 13px}.selection-empty{padding:15px 13px;color:var(--muted);font-size:11px;line-height:1.75}.control-grid{display:grid;grid-template-columns:1.2fr .7fr;gap:7px}.control-grid.four{grid-template-columns:1.3fr .65fr .65fr .65fr}.control-grid.five{grid-template-columns:1.25fr .6fr .6fr .6fr .6fr}.position-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:end}.inline-btn{height:37px;border:1px solid var(--line);background:#18181c;color:#d7d7dc;border-radius:8px;padding:0 10px;font-size:10.5px;white-space:nowrap}.inline-btn:hover{border-color:var(--acid);color:var(--acid)}.inline-btn.danger:hover{border-color:var(--danger);color:var(--danger)}.hero-thumb,.custom-thumb{width:100%;height:125px;object-fit:cover;border-radius:8px;border:1px solid #303036;background:#09090b}.hero-upload{display:grid;grid-template-columns:1.65fr .8fr;gap:9px;align-items:stretch;margin-top:11px}.hero-upload .upload-label{min-height:125px}.editor-tip{color:#b8b8bd;font-size:10.5px;line-height:1.65;padding:9px 10px;border:1px solid #29292e;background:#101013;border-radius:8px;margin-top:10px}.editor-tip strong{color:var(--acid)}.checkline{display:flex;align-items:center;gap:8px;color:#c3c3c8;font-size:11px}.range-line{display:grid;grid-template-columns:1fr 70px;gap:7px;align-items:center}.range-line input[type="range"]{padding:0}.element-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}.element-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid #29292e;background:#101013;border-radius:8px;padding:8px}.element-row .type{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acid);border:1px solid #4e5729;border-radius:99px;padding:3px 5px}.element-row .name{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.element-row .sub{display:block;color:#777;font-size:9px;margin-top:2px}.element-row button{border:0;background:none;color:#aaa;font-size:10px}.element-row button:hover{color:var(--acid)}.add-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.add-card{border:1px solid #34343a;background:#151519;color:#d4d4d8;border-radius:9px;padding:12px 7px;text-align:center;font-size:10.5px}.add-card b{display:block;font-size:18px;font-weight:400;margin-bottom:5px}.add-card:hover{border-color:var(--acid);color:var(--acid)}.section-chip{font-size:9px;color:#777}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{width:min(560px,100%);max-height:90vh;overflow:auto;background:#17171b;border:1px solid #3b3b41;border-radius:16px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modal h2{font-size:17px;margin:0}.x{background:none;border:0;color:#aaa;font-size:24px}.security{font-size:10.5px;color:var(--muted);line-height:1.7;padding:10px;border-radius:8px;background:#101013;border:1px solid var(--line);margin-top:13px}.security strong{color:var(--acid)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f0eee7;color:#111;padding:9px 13px;border-radius:8px;font-size:11px;z-index:50;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.canvas-label{display:none}.layout{grid-template-columns:minmax(0,1.3fr) minmax(370px,.8fr)}}@media(max-width:880px){body{overflow:auto}.topbar{position:sticky;top:0;z-index:20}.save-state,.history-actions{display:none}.layout{height:auto;display:block}.preview{height:62vh;min-height:470px}.editor{border-left:0;border-top:1px solid var(--line);overflow:visible}.editor-head{top:58px}.form{padding-bottom:50px}}@media(max-width:580px){.topbar{padding:0 8px}.brand small,.button.ghost{display:none}.preview{height:52vh;min-height:390px}.canvas-tools .mini:nth-of-type(n+3),.section-select{display:none}.frame-wrap{padding:5px}.form{padding:8px}.row,.row.three,.triple,.control-grid.four,.control-grid.five{grid-template-columns:1fr}.editor-head{padding:13px 11px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><i></i><span>Portfolio Studio</span><small>/ 可视化工作台</small></div>
  <div class="top-actions">
    <div class="history-actions"><button class="button icon" id="undoBtn" title="撤销 Ctrl/⌘+Z">↶</button><button class="button icon" id="redoBtn" title="重做 Ctrl/⌘+Shift+Z">↷</button></div>
    <span class="save-state" id="saveState">当前为预览状态</span>
    <button class="button ghost" id="openSite">打开正式页 ↗</button>
    <button class="button" id="settingsBtn">GitHub 设置</button>
    <button class="button primary" id="publishBtn">保存并发布</button>
  </div>
</header>
<div class="layout">
  <section class="preview">
    <div class="preview-tools">
      <div class="canvas-tools"><span class="canvas-label">画布</span><select class="section-select" id="quickSection"><option value="hero">首屏</option><option value="work">作品区</option><option value="method">创作方法</option><option value="expertise">我的实践</option><option value="about">关于我</option><option value="contact">联系区</option></select><button class="mini" data-quick-add="text">＋文本</button><button class="mini" data-quick-add="image">＋图片</button><button class="mini" data-quick-add="link">＋链接</button></div>
      <div class="viewport"><button class="active" data-view="desktop">桌面</button><button data-view="tablet">平板</button><button data-view="mobile">手机</button></div>
    </div>
    <div class="frame-wrap"><div class="frame-shell" id="frameShell"><iframe id="previewFrame" src="index.html?preview=1" title="网站最终效果预览"></iframe></div></div>
  </section>
  <aside class="editor"><div class="editor-head"><h1>编辑网站</h1><p>点击左侧元素直接编辑。内置文字可移动/隐藏，自由元素可新增、复制、删除、换图并设置链接。</p></div><div class="form" id="form"></div></aside>
</div>
<div class="modal" id="settingsModal"><div class="modal-card"><div class="modal-head"><h2>连接 GitHub 仓库</h2><button class="x" id="closeSettings">×</button></div><div class="field"><label>GitHub 用户名 / Organization</label><input id="ghOwner" placeholder="例如 mountainlost"></div><div class="field"><label>仓库名</label><input id="ghRepo" placeholder="例如 Portfolio"></div><div class="row"><div class="field"><label>发布分支</label><input id="ghBranch" value="main"></div><div class="field"><label>正式网站地址（可选）</label><input id="siteUrl" placeholder="https://mountainlost.github.io/Portfolio/"></div></div><div class="field"><label>Fine-grained Personal Access Token</label><input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_..."></div><div class="security"><strong>安全：</strong>Token 只存在当前标签页 sessionStorage，不写入仓库。建议只授权这个仓库的 Contents: Read and write。</div><div class="modal-actions"><button class="button" id="cancelSettings">取消</button><button class="button primary" id="saveSettings">保存连接信息</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="content.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let draft=structuredClone(window.PORTFOLIO_CONTENT||{}),frameReady=false,selected=null,history=[],historyIndex=-1,historyTimer=null,applyingHistory=false;
const pendingProjectUploads=new Map(),pendingCustomUploads=new Map();let pendingHeroUpload=null;
function ensure(){draft.design ||= {};draft.design.heroImage ||= 'assets/hero-art.webp';draft.design.heroMotion ||= {enabled:true,intensity:.018,speed:.42,parallax:.28};draft.design.elementStyles ||= {};draft.design.elementOffsets ||= {};draft.design.hiddenElements ||= [];draft.design.customElements ||= [];draft.projects ||= []}ensure();
const config={owner:localStorage.getItem('portfolio-gh-owner')||'',repo:localStorage.getItem('portfolio-gh-repo')||'',branch:localStorage.getItem('portfolio-gh-branch')||'main',siteUrl:localStorage.getItem('portfolio-site-url')||'',token:sessionStorage.getItem('portfolio-gh-token')||''};
const sections={hero:'首屏',work:'精选作品',method:'创作方法',expertise:'我的实践',about:'关于我',contact:'联系合作'};
const groups=[
 {title:'首屏文字',fields:[['hero.topLeft','左上说明','textarea'],['hero.topRight','右上说明','textarea'],['hero.caption','主说明','textarea'],['hero.captionAccent','荧光强调词','input'],['hero.edition','版本信息','textarea'],['hero.side','右侧修饰文字','input'],['hero.scroll','向下引导','input'],['hero.bottom','底部修饰文字','input']]},
 {title:'精选作品区',fields:[['work.eyebrow','栏目编号 / 小标题','input'],['work.title','大标题','textarea'],['work.intro','栏目介绍','textarea']]},
 {title:'创作观点',fields:[['philosophy.eyebrow','栏目编号 / 小标题','input'],['philosophy.line1','第一行','input'],['philosophy.line2','第二行','input'],['philosophy.line3','荧光强调行','input'],['philosophy.body','说明文字','textarea']]},
 {title:'我的实践',fields:[['expertise.eyebrow','栏目编号 / 小标题','input'],['expertise.title','大标题','textarea'],['expertise.intro','介绍文字','textarea'],['expertise.items.0','能力 01','input'],['expertise.items.1','能力 02','input'],['expertise.items.2','能力 03','input'],['expertise.items.3','能力 04','input']]},
 {title:'关于我',fields:[['about.eyebrow','栏目编号 / 小标题','input'],['about.title','大标题','textarea'],['about.body','个人介绍','textarea'],['about.noteLeft','底部左侧文字','input'],['about.noteRight','底部右侧修饰','input']]},
 {title:'联系信息',fields:[['contact.eyebrow','栏目编号 / 小标题','input'],['contact.title','联系大标题','input'],['contact.lead','联系说明','textarea'],['contact.email','邮箱','input'],['contact.behance','Behance 链接','input'],['contact.instagram','Instagram 链接','input']]},
 {title:'导航与页脚',fields:[['nav.work','导航：作品','input'],['nav.approach','导航：方法','input'],['nav.about','导航：关于','input'],['nav.contact','导航：联系','input'],['nav.status','合作状态','input'],['footer.left','页脚左侧','input'],['footer.center','页脚修饰文字','input'],['footer.top','返回顶部','input']]}
];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function get(path){return String(path).split('.').reduce((o,k)=>o?.[k],draft)}
function set(path,value){const a=String(path).split('.');let o=draft;a.slice(0,-1).forEach(k=>o=o[k]);o[a.at(-1)]=value;sendPreview();markDirty()}
function uid(){return 'el-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function sectionOptions(value){return Object.entries(sections).map(([v,n])=>`<option value="${v}" ${v===value?'selected':''}>${n}</option>`).join('')}
function fieldHtml([path,label,type]){const v=get(path);return `<div class="field"><label>${esc(label)}</label>${type==='textarea'?`<textarea data-path="${path}">${esc(v)}</textarea>`:`<input data-path="${path}" value="${esc(v)}">`}</div>`}
function fontOptions(value){const opts=[['','跟随网站默认'],['Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif','现代无衬线'],['"PingFang SC", "Microsoft YaHei", sans-serif','苹方 / 微软雅黑'],['"Noto Sans SC", "PingFang SC", sans-serif','Noto Sans SC'],['"Songti SC", "SimSun", serif','宋体'],['"Kaiti SC", "KaiTi", serif','楷体'],['Arial, sans-serif','Arial'],['"Times New Roman", serif','Times New Roman'],['ui-monospace, SFMono-Regular, Menlo, Consolas, monospace','等宽字体']];return opts.map(([v,n])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${n}</option>`).join('')}
function inspectorEmpty(){return `<div class="selection-panel" id="selectionInspector"><div class="selection-empty"><strong style="color:#f0eee7">直接编辑模式</strong><br>点击左侧文字、图片或自定义元素。可拖动位置并自动吸附；右侧会出现字体、尺寸、层级、链接和删除等选项。</div></div>`}
function addPanel(){return `<details class="group" open><summary>添加元素</summary><div class="group-body"><div class="hint">自由元素不会被模板锁死。先选目标区域，再添加文字、图片或文本超链接。</div><div class="field"><label>添加到区域</label><select id="addSection">${sectionOptions($('#quickSection')?.value||'hero')}</select></div><div class="add-grid"><button class="add-card" data-add="text"><b>T</b>文本</button><button class="add-card" data-add="image"><b>▧</b>图片</button><button class="add-card" data-add="link"><b>↗</b>文本链接</button></div></div></details>`}
function heroPanel(){const m=draft.design.heroMotion;return `<details class="group" open><summary>首屏主视觉 / 动效</summary><div class="group-body"><div class="hint">主图保持为普通图片文件，但前台会用 WebGL 做缓慢液态流动、光泽和鼠标视差。GitHub Pages 可直接运行；手机端会自动降低强度。</div><div class="hero-upload"><img class="hero-thumb" id="heroThumb" src="${esc(draft.design.heroImage)}" alt="主视觉"><label class="upload-label">上传 / 替换主图<input type="file" accept="image/*" id="heroUpload"></label></div><div class="field"><label class="checkline"><input type="checkbox" id="motionEnabled" ${m.enabled!==false?'checked':''}> 启用动态主视觉</label></div><div class="field"><label>流动强度</label><div class="range-line"><input type="range" id="motionIntensity" min="0" max="0.05" step="0.001" value="${m.intensity??.018}"><input type="number" id="motionIntensityNum" min="0" max="0.05" step="0.001" value="${m.intensity??.018}"></div></div><div class="row"><div class="field"><label>流动速度</label><input type="number" id="motionSpeed" min="0.05" max="2" step="0.05" value="${m.speed??.42}"></div><div class="field"><label>鼠标视差</label><input type="number" id="motionParallax" min="0" max="1" step="0.05" value="${m.parallax??.28}"></div></div></div></details>`}
function titlePanel(){return `<details class="group" open><summary>首页主标题</summary><div class="group-body"><div class="hint">完整标题为 <b style="color:#fff">PORTFOLIO</b>。为了保留中段描边效果，视觉上拆为 PORT / FOL / IO 三段。</div><div class="triple">${fieldHtml(['hero.titleBefore','前段','input'])}${fieldHtml(['hero.titleOutline','描边段','input'])}${fieldHtml(['hero.titleAfter','后段','input'])}</div></div></details>`}
function projectsHtml(){return `<details class="group" open><summary>作品项目</summary><div class="group-body"><div class="hint">项目数量不再固定。可新增、删除、换图；项目详情仍会自动使用现有作品弹窗。</div><button class="inline-btn" id="addProject">＋ 添加一个作品项目</button>${draft.projects.map((p,i)=>`<div class="project-card"><h3><span>项目 ${String(i+1).padStart(2,'0')} · ${esc(p.name)}</span><button data-delete-project="${i}">删除</button></h3><div class="image-control"><img class="thumb" id="thumb-${i}" src="${esc(p.image)}" alt=""><label class="upload-label">替换封面<input type="file" accept="image/*" data-project-upload="${i}"></label></div>${fieldHtml([`projects.${i}.name`,'项目名称','input'])}<div class="row">${fieldHtml([`projects.${i}.type`,'类型 / 标签','input'])}${fieldHtml([`projects.${i}.year`,'年份','input'])}</div><div class="field"><label>所属分类</label><select data-path="projects.${i}.category"><option value="identity" ${p.category==='identity'?'selected':''}>视觉识别</option><option value="digital" ${p.category==='digital'?'selected':''}>数字体验</option><option value="experimental" ${p.category==='experimental'?'selected':''}>实验创作</option></select></div>${fieldHtml([`projects.${i}.description`,'项目介绍','textarea'])}<div class="field"><label>详情标签（逗号分隔）</label><input data-tags="${i}" value="${esc((p.tags||[]).join('，'))}"></div></div>`).join('')}</div></details>`}
function elementLibrary(){const customs=draft.design.customElements||[],hidden=draft.design.hiddenElements||[];return `<details class="group" open><summary>元素 / 图层</summary><div class="group-body"><div class="hint">自由元素可以独立定位和设置层级；模板元素删除后会进入“已隐藏”，随时可恢复。</div>${customs.length?`<div class="element-list">${customs.map(x=>`<div class="element-row"><span class="type">${x.type==='image'?'IMG':x.type==='link'?'LINK':'TEXT'}</span><div class="name">${esc(x.type==='image'?(x.alt||'图片'):(x.text||'未命名元素'))}<span class="sub">${sections[x.section]||x.section} · Z ${x.zIndex??20}</span></div><button data-select-custom="${esc(x.id)}">选择</button></div>`).join('')}</div>`:'<div class="hint">还没有自由元素。</div>'}${hidden.length?`<div class="field"><label>已隐藏模板元素</label><div class="element-list">${hidden.map(k=>`<div class="element-row"><span class="type">HIDE</span><div class="name">${esc(k)}</div><button data-restore="${esc(k)}">恢复</button></div>`).join('')}</div></div>`:''}</div></details>`}
function renderForm(){ensure();const host=$('#form');host.innerHTML=inspectorEmpty()+addPanel()+heroPanel()+titlePanel()+groups.map((g,i)=>`<details class="group" ${i<2?'open':''}><summary>${g.title}</summary><div class="group-body">${g.fields.map(fieldHtml).join('')}</div></details>${i===1?projectsHtml():''}`).join('')+elementLibrary()+`<div class="publish-note"><b>编辑机制：</b>模板内容与自由元素都会写入 <code>content.js</code>；新上传图片写入 <code>assets/uploads/</code>。点击“保存并发布”后提交 GitHub，Pages 自动重新发布。</div>`;bindForm();if(selected){if(selected.kind==='custom')renderCustomInspector(selected.id);else renderBuiltinInspector(selected)}}

 $('#motionEnabled')?.addEventListener('change',syncMotion);$('#motionIntensity')?.addEventListener('input',syncMotion);$('#motionSpeed')?.addEventListener('input',syncMotion);$('#motionParallax')?.addEventListener('input',syncMotion);$('#motionIntensityNum')?.addEventListener('input',e=>{$('#motionIntensity').value=e.target.value;syncMotion()});

function addElement(type,section='hero'){const id=uid(),base={id,type,section,x:52,y:34,width:type==='image'?320:280,height:type==='image'?220:80,zIndex:30,mobileVisible:true,style:{fontFamily:'',fontSize:type==='link'?16:22,fontWeight:600,lineHeight:1.35,letterSpacing:0,color:'#f0eee7',textAlign:'left',opacity:1,borderRadius:0,objectFit:'cover'}};if(type==='text')base.text='新文本';if(type==='link'){base.text='文本链接 ↗';base.href='#';base.newTab=true}if(type==='image'){base.src='';base.alt='自定义图片';base.href='';base.newTab=true}draft.design.customElements.push(base);selected={kind:'custom',id};sendPreview();markDirty();renderForm();setTimeout(()=>selectCustom(id),60)}
function selectCustom(id){selected={kind:'custom',id};$('#previewFrame').contentWindow.postMessage({type:'portfolio-select-custom',id},'*');renderCustomInspector(id);$('.editor').scrollTo({top:0,behavior:'smooth'})}
function selectBuiltin(key){selected={kind:'builtin',key};$('#previewFrame').contentWindow.postMessage({type:'portfolio-select-key',key},'*')}
function rgbToHex(v){if(!v)return'#f0eee7';if(v.startsWith('#'))return v.slice(0,7);const m=v.match(/\d+(?:\.\d+)?/g);if(!m||m.length<3)return'#f0eee7';return'#'+m.slice(0,3).map(n=>Math.max(0,Math.min(255,+n)).toString(16).padStart(2,'0')).join('')}
function renderBuiltinInspector(info){selected={...info,kind:'builtin'};const box=$('#selectionInspector');if(!box)return;const style=draft.design.elementStyles[info.key]||{},off=draft.design.elementOffsets[info.key]||info.offset||{x:0,y:0};const fs=Math.round(info.style?.fontSize||16),lh=Math.round(((info.style?.lineHeight||fs*1.3)/fs)*100)/100,ls=Math.round((info.style?.letterSpacing||0)*100)/100,color=style.color||rgbToHex(info.style?.color);box.innerHTML=`<div class="selection-head"><b>模板文字</b><span>${esc(info.key)}</span></div><div class="selection-body"><div class="field"><label>文字内容</label><textarea id="selectedText">${esc(get(info.key)??'')}</textarea></div><div class="field"><label>字体 / 字号 / 粗细 / 行高 / 字距</label><div class="control-grid five"><select id="fontFamily">${fontOptions(style.fontFamily||'')}</select><input id="fontSize" type="number" min="8" max="420" value="${style.fontSize??fs}"><input id="fontWeight" type="number" min="100" max="900" step="50" value="${style.fontWeight??info.style?.fontWeight??600}"><input id="lineHeight" type="number" min=".6" max="4" step=".05" value="${style.lineHeight??lh}"><input id="letterSpacing" type="number" min="-30" max="80" step=".1" value="${style.letterSpacing??ls}"></div></div><div class="row three"><div class="field"><label>颜色</label><input id="textColor" type="color" value="${color}"></div><div class="field"><label>对齐</label><select id="textAlign"><option value="left">左</option><option value="center">中</option><option value="right">右</option></select></div><div class="field"><label>透明度</label><input id="opacity" type="number" min="0" max="1" step=".05" value="${style.opacity??info.style?.opacity??1}"></div></div><div class="field"><label>位置偏移 X / Y / 层级 Z</label><div class="row three"><input id="offsetX" type="number" value="${+off.x||0}"><input id="offsetY" type="number" value="${+off.y||0}"><input id="zIndex" type="number" value="${style.zIndex??''}" placeholder="自动"></div></div><div class="row"><button class="inline-btn" id="duplicateBuiltin">复制为自由文本</button><button class="inline-btn" id="resetBuiltin">恢复默认样式/位置</button></div><div class="row"><button class="inline-btn" id="locateBuiltin">重新选中</button><button class="inline-btn danger" id="hideBuiltin">删除 / 隐藏元素</button></div><div class="editor-tip"><strong>画布拖动：</strong>按住左侧文字移动，会按 8px 网格并吸附到页面中线、容器边界和邻近元素。</div></div>`;$('#textAlign').value=style.textAlign||info.style?.textAlign||'left';
 $('#selectedText').oninput=e=>set(info.key,e.target.value);
 const upd=()=>{draft.design.elementStyles[info.key]={fontFamily:$('#fontFamily').value,fontSize:+$('#fontSize').value,fontWeight:+$('#fontWeight').value,lineHeight:+$('#lineHeight').value,letterSpacing:+$('#letterSpacing').value,color:$('#textColor').value,textAlign:$('#textAlign').value,opacity:+$('#opacity').value,zIndex:$('#zIndex').value===''?'':+$('#zIndex').value};sendPreview();markDirty()};['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','textColor','textAlign','opacity','zIndex'].forEach(id=>$('#'+id).addEventListener('input',upd));
 const pos=()=>{draft.design.elementOffsets[info.key]={x:+$('#offsetX').value||0,y:+$('#offsetY').value||0};sendPreview();markDirty()};$('#offsetX').oninput=pos;$('#offsetY').oninput=pos;
 $('#resetBuiltin').onclick=()=>{delete draft.design.elementStyles[info.key];delete draft.design.elementOffsets[info.key];sendPreview();markDirty();setTimeout(()=>selectBuiltin(info.key),40)};
 $('#locateBuiltin').onclick=()=>selectBuiltin(info.key);
 $('#hideBuiltin').onclick=()=>{if(!draft.design.hiddenElements.includes(info.key))draft.design.hiddenElements.push(info.key);selected=null;sendPreview();markDirty();renderForm()};
 $('#duplicateBuiltin').onclick=()=>{const rectText=get(info.key)??info.value??'新文本';const id=uid();draft.design.customElements.push({id,type:'text',section:'hero',text:String(rectText),x:20,y:35,width:300,height:80,zIndex:35,mobileVisible:true,style:{fontFamily:$('#fontFamily').value,fontSize:+$('#fontSize').value,fontWeight:+$('#fontWeight').value,lineHeight:+$('#lineHeight').value,letterSpacing:+$('#letterSpacing').value,color:$('#textColor').value,textAlign:$('#textAlign').value,opacity:+$('#opacity').value}});sendPreview();markDirty();renderForm();setTimeout(()=>selectCustom(id),50)};
}
function renderCustomInspector(id){const item=draft.design.customElements.find(x=>x.id===id),box=$('#selectionInspector');if(!item||!box){selected=null;return}selected={kind:'custom',id};const s=item.style||{};const textFields=item.type!=='image'?`<div class="field"><label>${item.type==='link'?'链接文字':'文字内容'}</label><textarea id="customText">${esc(item.text||'')}</textarea></div><div class="field"><label>字体 / 字号 / 粗细 / 行高 / 字距</label><div class="control-grid five"><select id="cFont">${fontOptions(s.fontFamily||'')}</select><input id="cSize" type="number" min="8" max="420" value="${s.fontSize||18}"><input id="cWeight" type="number" min="100" max="900" step="50" value="${s.fontWeight||600}"><input id="cLine" type="number" min=".6" max="4" step=".05" value="${s.lineHeight||1.4}"><input id="cLetter" type="number" min="-30" max="80" step=".1" value="${s.letterSpacing||0}"></div></div><div class="row three"><div class="field"><label>颜色</label><input id="cColor" type="color" value="${s.color||'#f0eee7'}"></div><div class="field"><label>对齐</label><select id="cAlign"><option value="left">左</option><option value="center">中</option><option value="right">右</option></select></div><div class="field"><label>透明度</label><input id="cOpacity" type="number" min="0" max="1" step=".05" value="${s.opacity??1}"></div></div>`:`<div class="field"><label>图片</label>${item.src?`<img class="custom-thumb" id="customThumb" src="${esc(item.src)}" alt="">`:'<div class="custom-thumb" id="customThumb" style="display:grid;place-items:center;color:#666">等待上传图片</div>'}<label class="upload-label" style="margin-top:7px">上传 / 替换图片<input type="file" accept="image/*" id="customUpload"></label></div><div class="field"><label>图片说明 Alt</label><input id="customAlt" value="${esc(item.alt||'')}"></div><div class="row"><div class="field"><label>圆角 px</label><input id="cRadius" type="number" min="0" max="300" value="${s.borderRadius||0}"></div><div class="field"><label>裁切方式</label><select id="cFit"><option value="cover">铺满裁切</option><option value="contain">完整显示</option><option value="fill">拉伸</option></select></div></div><div class="field"><label>透明度</label><input id="cOpacity" type="number" min="0" max="1" step=".05" value="${s.opacity??1}"></div>`;const linkFields=item.type==='link'||item.type==='image'?`<div class="field"><label>${item.type==='image'?'图片点击链接（可留空）':'链接地址'}</label><input id="customHref" value="${esc(item.href||'')}"></div><div class="field"><label class="checkline"><input id="customNewTab" type="checkbox" ${item.newTab!==false?'checked':''}> 在新标签页打开</label></div>`:'';box.innerHTML=`<div class="selection-head"><b>自由${item.type==='image'?'图片':item.type==='link'?'链接':'文本'}</b><span>${esc(item.id)}</span></div><div class="selection-body">${textFields}${linkFields}<div class="field"><label>所在区域</label><select id="customSection">${sectionOptions(item.section||'hero')}</select></div><div class="field"><label>位置 X% / Y% · 尺寸 W / H · 层级 Z</label><div class="control-grid five"><input id="cX" type="number" step=".1" value="${item.x??50}"><input id="cY" type="number" step=".1" value="${item.y??50}"><input id="cW" type="number" min="8" value="${item.width||280}"><input id="cH" type="number" min="8" value="${item.height||80}"><input id="cZ" type="number" value="${item.zIndex??30}"></div></div><div class="field"><label class="checkline"><input id="cMobile" type="checkbox" ${item.mobileVisible!==false?'checked':''}> 手机端显示</label></div><div class="row"><button class="inline-btn" id="duplicateCustom">复制元素</button><button class="inline-btn" id="bringFront">置于顶层</button></div><div class="row"><button class="inline-btn" id="locateCustom">重新选中</button><button class="inline-btn danger" id="deleteCustom">删除元素</button></div><div class="editor-tip"><strong>自由元素：</strong>可直接拖动；位置以所在区域百分比保存，因此不同屏幕尺寸下更稳定。</div></div>`;if($('#cAlign'))$('#cAlign').value=s.textAlign||'left';if($('#cFit'))$('#cFit').value=s.objectFit||'cover';
 function patch(){item.section=$('#customSection').value;item.x=+$('#cX').value||0;item.y=+$('#cY').value||0;item.width=Math.max(8,+$('#cW').value||8);item.height=Math.max(8,+$('#cH').value||8);item.zIndex=+$('#cZ').value||0;item.mobileVisible=$('#cMobile').checked;item.style ||= {};item.style.opacity=+$('#cOpacity').value;if(item.type!=='image'){item.text=$('#customText').value;Object.assign(item.style,{fontFamily:$('#cFont').value,fontSize:+$('#cSize').value,fontWeight:+$('#cWeight').value,lineHeight:+$('#cLine').value,letterSpacing:+$('#cLetter').value,color:$('#cColor').value,textAlign:$('#cAlign').value})}else{item.alt=$('#customAlt').value;item.style.borderRadius=+$('#cRadius').value||0;item.style.objectFit=$('#cFit').value}if(item.type==='link'||item.type==='image'){item.href=$('#customHref').value;item.newTab=$('#customNewTab').checked}sendPreview();markDirty()}
 ['customSection','cX','cY','cW','cH','cZ','cMobile','cOpacity','customText','cFont','cSize','cWeight','cLine','cLetter','cColor','cAlign','customAlt','cRadius','cFit','customHref','customNewTab'].forEach(k=>$('#'+k)?.addEventListener('input',patch));
 $('#customUpload')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;const dataUrl=await fileToDataUrl(file);pendingCustomUploads.set(item.id,{file,dataUrl});item.src=dataUrl;sendPreview();markDirty('有自定义图片尚未发布');renderCustomInspector(item.id)});
 $('#deleteCustom').onclick=()=>{draft.design.customElements=draft.design.customElements.filter(x=>x.id!==item.id);pendingCustomUploads.delete(item.id);selected=null;sendPreview();markDirty();renderForm()};
 $('#duplicateCustom').onclick=()=>{const copy=structuredClone(item);copy.id=uid();copy.x=Math.min(92,(+item.x||0)+3);copy.y=Math.min(92,(+item.y||0)+3);copy.text=copy.text?copy.text+' 副本':copy.text;draft.design.customElements.push(copy);sendPreview();markDirty();renderForm();setTimeout(()=>selectCustom(copy.id),50)};
 $('#bringFront').onclick=()=>{item.zIndex=Math.max(20,...draft.design.customElements.map(x=>+x.zIndex||0))+1;$('#cZ').value=item.zIndex;sendPreview();markDirty()};$('#locateCustom').onclick=()=>selectCustom(item.id);
}
function sendPreview(){if(frameReady)$('#previewFrame').contentWindow.postMessage({type:'portfolio-preview',content:draft},'*')}
function scheduleHistory(){if(applyingHistory)return;clearTimeout(historyTimer);historyTimer=setTimeout(()=>pushHistory(),350)}
function pushHistory(force=false){const snap=JSON.stringify(draft);if(!force&&history[historyIndex]===snap)return;history=history.slice(0,historyIndex+1);history.push(snap);if(history.length>50)history.shift();historyIndex=history.length-1;updateHistoryButtons()}
function updateHistoryButtons(){$('#undoBtn').disabled=historyIndex<=0;$('#redoBtn').disabled=historyIndex>=history.length-1}
function markDirty(msg='有未发布修改'){$('#saveState').textContent=msg;$('#saveState').style.color='#d9ff55';scheduleHistory()}
function applyHistory(i){if(i<0||i>=history.length)return;applyingHistory=true;historyIndex=i;draft=JSON.parse(history[i]);ensure();selected=null;renderForm();sendPreview();$('#saveState').textContent='已恢复历史状态，尚未发布';$('#saveState').style.color='#d9ff55';applyingHistory=false;updateHistoryButtons()}
$('#undoBtn').onclick=()=>applyHistory(historyIndex-1);$('#redoBtn').onclick=()=>applyHistory(historyIndex+1);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();applyHistory(historyIndex+(e.shiftKey?1:-1))}});
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
$('#previewFrame').addEventListener('load',()=>{frameReady=true;sendPreview()});$$('[data-view]').forEach(b=>b.addEventListener('click',()=>{$$('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#frameShell').className='frame-shell '+(b.dataset.view==='desktop'?'':b.dataset.view)}));
$$('[data-quick-add]').forEach(b=>b.onclick=()=>addElement(b.dataset.quickAdd,$('#quickSection').value));
window.addEventListener('message',e=>{if(e.source!==$('#previewFrame').contentWindow)return;if(e.data?.type==='portfolio-select'){renderBuiltinInspector(e.data);$('.editor').scrollTo({top:0,behavior:'smooth'})}if(e.data?.type==='portfolio-select-custom'){renderCustomInspector(e.data.item?.id||e.data.id);$('.editor').scrollTo({top:0,behavior:'smooth'})}if(e.data?.type==='portfolio-layout-change'){const {key,offset}=e.data;draft.design.elementOffsets[key]=offset;markDirty();if(selected?.key===key){const x=$('#offsetX'),y=$('#offsetY');if(x)x.value=offset.x;if(y)y.value=offset.y}}if(e.data?.type==='portfolio-custom-change'){const item=draft.design.customElements.find(x=>x.id===e.data.id);if(item)Object.assign(item,e.data.patch||{});markDirty();if(selected?.id===e.data.id){if($('#cX'))$('#cX').value=item.x;if($('#cY'))$('#cY').value=item.y}}});
function fillSettings(){$('#ghOwner').value=config.owner;$('#ghRepo').value=config.repo;$('#ghBranch').value=config.branch;$('#siteUrl').value=config.siteUrl;$('#ghToken').value=config.token}function openSettings(){fillSettings();$('#settingsModal').classList.add('open')}function closeSettings(){$('#settingsModal').classList.remove('open')}$('#settingsBtn').onclick=openSettings;$('#closeSettings').onclick=closeSettings;$('#cancelSettings').onclick=closeSettings;$('#settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeSettings()});$('#saveSettings').onclick=()=>{config.owner=$('#ghOwner').value.trim();config.repo=$('#ghRepo').value.trim();config.branch=$('#ghBranch').value.trim()||'main';config.siteUrl=$('#siteUrl').value.trim();config.token=$('#ghToken').value.trim();localStorage.setItem('portfolio-gh-owner',config.owner);localStorage.setItem('portfolio-gh-repo',config.repo);localStorage.setItem('portfolio-gh-branch',config.branch);localStorage.setItem('portfolio-site-url',config.siteUrl);sessionStorage.setItem('portfolio-gh-token',config.token);closeSettings();toast('GitHub 连接信息已保存')};$('#openSite').onclick=()=>window.open(config.siteUrl||'index.html','_blank');
function readyConfig(){return config.owner&&config.repo&&config.branch&&config.token}async function gh(path,opt={}){const res=await fetch('https://api.github.com'+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+config.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...(opt.headers||{})}});if(!res.ok){let detail='';try{detail=(await res.json()).message||''}catch{}throw new Error(`GitHub 请求失败（${res.status}）${detail?'：'+detail:''}`)}return res.status===204?null:res.json()}
function safeName(name){const dot=name.lastIndexOf('.'),ext=dot>-1?name.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g,''):'';const base=(dot>-1?name.slice(0,dot):name).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'image';return base+ext}function bufferToBase64(buf){const bytes=new Uint8Array(buf);let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(out)}function textToBase64(s){return bufferToBase64(new TextEncoder().encode(s).buffer)}async function putNewFile(path,file,message){const base64=bufferToBase64(await file.arrayBuffer());await gh(`/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${path}`,{method:'PUT',body:JSON.stringify({message,content:base64,branch:config.branch})});return path}
async function uploadPending(){if(pendingHeroUpload){$('#saveState').textContent='正在上传首屏主图…';const path=`assets/uploads/${Date.now()}-hero-${safeName(pendingHeroUpload.file.name)}`;await putNewFile(path,pendingHeroUpload.file,'更新首屏主图');draft.design.heroImage=path;pendingHeroUpload=null}for(const [i,item] of [...pendingProjectUploads]){if(!draft.projects[i])continue;$('#saveState').textContent=`正在上传项目 ${i+1} 图片…`;const path=`assets/uploads/${Date.now()}-project-${i+1}-${safeName(item.file.name)}`;await putNewFile(path,item.file,`更新作品图片：${draft.projects[i].name}`);draft.projects[i].image=path;pendingProjectUploads.delete(i)}for(const [id,item] of [...pendingCustomUploads]){const el=draft.design.customElements.find(x=>x.id===id);if(!el)continue;$('#saveState').textContent='正在上传自由图片…';const path=`assets/uploads/${Date.now()}-${id}-${safeName(item.file.name)}`;await putNewFile(path,item.file,'更新自由图片元素');el.src=path;pendingCustomUploads.delete(id)}}
async function publishContent(){const api=`/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/content.js`;const current=await gh(api+`?ref=${encodeURIComponent(config.branch)}`);const output='window.PORTFOLIO_CONTENT = '+JSON.stringify(draft,null,2)+';\n';await gh(api,{method:'PUT',body:JSON.stringify({message:'通过 Portfolio Studio 更新网站',content:textToBase64(output),sha:current.sha,branch:config.branch})})}
$('#publishBtn').onclick=async()=>{if(!readyConfig()){openSettings();toast('首次发布前需要连接 GitHub 仓库');return}const btn=$('#publishBtn');btn.disabled=true;btn.textContent='正在发布…';try{await uploadPending();sendPreview();$('#saveState').textContent='正在写入网站内容…';await publishContent();$('#saveState').textContent='已提交到 GitHub，Pages 将自动更新';$('#saveState').style.color='#9cff9c';btn.textContent='已发布 ✓';pushHistory(true);toast('发布成功');setTimeout(()=>btn.textContent='保存并发布',1800)}catch(err){console.error(err);$('#saveState').textContent='发布失败：'+err.message;$('#saveState').style.color='#ff7b73';btn.textContent='保存并发布';toast(err.message)}finally{btn.disabled=false}};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400)}
renderForm();pushHistory(true);
})();
</script>

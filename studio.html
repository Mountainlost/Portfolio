<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio 内容工作台</title>
<style>
:root{--bg:#0d0d0f;--panel:#151518;--panel2:#1b1b1f;--text:#f1f0eb;--muted:#8e8e95;--line:#303035;--acid:#d9ff55;--danger:#ff7b73;--r:14px}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#101012;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;white-space:nowrap}.brand i{width:12px;height:12px;border:3px solid var(--acid);border-radius:50%;display:block}.top-actions{display:flex;align-items:center;gap:8px}.button{border:1px solid var(--line);background:#1a1a1e;color:var(--text);padding:9px 13px;border-radius:9px;font-size:12px;font-weight:650}.button:hover{border-color:#555}.button.primary{background:var(--acid);color:#101113;border-color:var(--acid)}.button.ghost{background:transparent}.button.small{padding:7px 10px}.save-state{font-size:11px;color:var(--muted);margin-right:4px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layout{height:calc(100% - 58px);display:grid;grid-template-columns:minmax(0,1.65fr) minmax(380px,.75fr)}.preview{min-width:0;background:#050505;display:flex;flex-direction:column;position:relative}.preview-tools{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#121215}.preview-tools .label{font-size:11px;color:var(--muted)}.viewport{display:flex;gap:5px}.viewport button{background:#1b1b1e;border:1px solid var(--line);color:#aaa;padding:6px 9px;border-radius:7px;font-size:11px}.viewport button.active{color:#111;background:var(--text);border-color:var(--text)}.frame-wrap{flex:1;display:flex;justify-content:center;min-height:0;overflow:auto;background:repeating-conic-gradient(#111 0 25%,#0d0d0f 0 50%) 0/20px 20px;padding:12px}.frame-shell{width:100%;height:100%;background:#0b0b0d;box-shadow:0 12px 50px rgba(0,0,0,.45);transition:width .2s;border-radius:3px;overflow:hidden}.frame-shell.mobile{width:390px;max-width:100%}.frame-shell.tablet{width:820px;max-width:100%}iframe{border:0;width:100%;height:100%;background:#0b0b0d}.editor{border-left:1px solid var(--line);background:var(--panel);overflow:auto}.editor-head{position:sticky;top:0;z-index:4;background:rgba(21,21,24,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:16px 18px}.editor-head h1{font-size:16px;margin:0 0 5px}.editor-head p{font-size:11px;line-height:1.6;color:var(--muted);margin:0}.form{padding:12px 14px 80px}.group{border:1px solid var(--line);border-radius:var(--r);background:#121215;margin-bottom:10px;overflow:hidden}.group summary{list-style:none;padding:16px;cursor:pointer;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}.group summary::-webkit-details-marker{display:none}.group summary:after{content:'＋';font-weight:400;color:var(--muted)}.group[open] summary:after{content:'－'}.group-body{padding:0 16px 18px;border-top:1px solid var(--line)}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0}.field{margin-top:15px}.field label{display:block;font-size:11px;color:#b8b8bd;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0d0d10;color:var(--text);border-radius:9px;padding:10px 11px;outline:none;font-size:13px;line-height:1.5}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--acid);box-shadow:0 0 0 2px rgba(217,255,85,.08)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.triple{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.project-card{margin-top:14px;padding:13px;border:1px solid #29292e;background:#0f0f12;border-radius:11px}.project-card h3{font-size:12px;margin:0 0 10px;display:flex;justify-content:space-between;color:#d7d7db}.image-control{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center}.thumb{width:76px;height:58px;object-fit:cover;background:#25252a;border-radius:7px;border:1px solid #303036}.upload-label{display:flex;align-items:center;justify-content:center;border:1px dashed #45454c;border-radius:8px;padding:10px;color:#c2c2c8;font-size:11px;cursor:pointer;background:#15151a;text-align:center}.upload-label:hover{border-color:var(--acid);color:var(--acid)}.upload-label input{display:none}.publish-note{font-size:11px;color:var(--muted);line-height:1.7;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#101013;margin:10px 0 0}.publish-note b{color:var(--text)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{width:min(560px,100%);max-height:90vh;overflow:auto;background:#17171b;border:1px solid #3b3b41;border-radius:18px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal h2{font-size:18px;margin:0}.x{background:none;border:0;color:#aaa;font-size:24px}.security{font-size:11px;color:var(--muted);line-height:1.7;padding:11px;border-radius:9px;background:#101013;border:1px solid var(--line);margin-top:14px}.security strong{color:var(--acid)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f0eee7;color:#111;padding:10px 14px;border-radius:9px;font-size:12px;z-index:50;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:980px){body{overflow:auto}.topbar{position:sticky;top:0;z-index:20}.save-state{display:none}.layout{height:auto;display:block}.preview{height:62vh;min-height:480px}.editor{border-left:0;border-top:1px solid var(--line);overflow:visible}.editor-head{top:58px}.form{padding-bottom:50px}}@media(max-width:580px){.topbar{padding:0 9px}.brand span:last-child{display:none}.button.ghost{display:none}.layout{display:block}.preview{height:52vh;min-height:390px}.preview-tools .label{display:none}.frame-wrap{padding:5px}.form{padding:8px}.row,.triple{grid-template-columns:1fr}.editor-head{padding:14px 12px}}

.selection-panel{border:1px solid #4b522d;border-radius:var(--r);background:linear-gradient(180deg,rgba(217,255,85,.07),rgba(217,255,85,.015));margin-bottom:10px;overflow:hidden}
.selection-head{padding:14px 15px 11px;border-bottom:1px solid rgba(217,255,85,.18);display:flex;align-items:start;justify-content:space-between;gap:10px}
.selection-head b{font-size:13px}.selection-head span{font-size:10px;color:var(--acid);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;text-align:right}
.selection-body{padding:0 15px 15px}.selection-empty{padding:18px 15px;color:var(--muted);font-size:12px;line-height:1.8}.control-grid{display:grid;grid-template-columns:1.15fr .75fr;gap:8px}.control-grid.four{grid-template-columns:1.4fr .7fr .7fr .7fr}.position-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.inline-btn{height:39px;border:1px solid var(--line);background:#18181c;color:#d7d7dc;border-radius:8px;padding:0 11px;font-size:11px;white-space:nowrap}.inline-btn:hover{border-color:var(--acid);color:var(--acid)}.hero-thumb{width:100%;height:130px;object-fit:cover;border-radius:9px;border:1px solid #303036;background:#09090b}.hero-upload{display:grid;grid-template-columns:1.7fr .8fr;gap:10px;align-items:stretch;margin-top:12px}.hero-upload .upload-label{min-height:130px}.editor-tip{color:#b8b8bd;font-size:11px;line-height:1.65;padding:10px 12px;border:1px solid #29292e;background:#101013;border-radius:9px;margin-top:11px}.editor-tip strong{color:var(--acid)}

</style>
</head>
<body>
<header class="topbar"><div class="brand"><i></i><span>Portfolio</span><span style="color:#777">/ 内容工作台</span></div><div class="top-actions"><span class="save-state" id="saveState">所有修改仅在预览中，点击保存才会上线</span><button class="button ghost" id="openSite">打开正式页 ↗</button><button class="button" id="settingsBtn">GitHub 设置</button><button class="button primary" id="publishBtn">保存并发布</button></div></header>
<div class="layout">
  <section class="preview"><div class="preview-tools"><span class="label">左侧 = 点击文字编辑 / 拖动位置 / 自动吸附</span><div class="viewport"><button class="active" data-view="desktop">桌面</button><button data-view="tablet">平板</button><button data-view="mobile">手机</button></div></div><div class="frame-wrap"><div class="frame-shell" id="frameShell"><iframe id="previewFrame" src="index.html?preview=1" title="网站最终效果预览"></iframe></div></div></section>
  <aside class="editor"><div class="editor-head"><h1>编辑网站内容</h1><p>点击左侧文字即可进入排版编辑；也可以继续在下方表单批量修改内容。</p></div><div class="form" id="form"></div></aside>
</div>
<div class="modal" id="settingsModal"><div class="modal-card"><div class="modal-head"><h2>连接 GitHub 仓库</h2><button class="x" id="closeSettings">×</button></div><div class="field"><label>GitHub 用户名 / Organization</label><input id="ghOwner" placeholder="例如 lucky-design"></div><div class="field"><label>仓库名</label><input id="ghRepo" placeholder="例如 portfolio"></div><div class="row"><div class="field"><label>发布分支</label><input id="ghBranch" value="main"></div><div class="field"><label>正式网站地址（可选）</label><input id="siteUrl" placeholder="https://你的域名.com/"></div></div><div class="field"><label>Fine-grained Personal Access Token</label><input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_... 或 ghp_..."></div><div class="security"><strong>安全说明：</strong>Token 只保存在当前浏览器标签页的 sessionStorage，关闭标签页后消失，不会写进网站或 GitHub 仓库。建议创建只针对这个仓库、仅有 Contents 读写权限的 Fine-grained token。</div><div class="modal-actions"><button class="button" id="cancelSettings">取消</button><button class="button primary" id="saveSettings">保存连接信息</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="content.js"></script>
<script>
(()=>{
  'use strict';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  let draft=structuredClone(window.PORTFOLIO_CONTENT||{}), pendingUploads=new Map(), pendingHeroUpload=null, frameReady=false, selected=null;
  draft.design ||= {}; draft.design.heroImage ||= 'assets/hero-art.webp'; draft.design.elementStyles ||= {}; draft.design.elementOffsets ||= {};
  const config={owner:localStorage.getItem('portfolio-gh-owner')||'',repo:localStorage.getItem('portfolio-gh-repo')||'',branch:localStorage.getItem('portfolio-gh-branch')||'main',siteUrl:localStorage.getItem('portfolio-site-url')||'',token:sessionStorage.getItem('portfolio-gh-token')||''};
  const groups=[
    {title:'首屏',hint:'品牌名 Portfolio 保持不动。这里控制第一屏的中文文案。',fields:[['hero.topLeft','左上说明','textarea'],['hero.topRight','右上说明','textarea'],['hero.caption','主说明','textarea'],['hero.captionAccent','需要显示荧光色的词','input'],['hero.edition','版本信息','textarea'],['hero.side','右侧竖排文字','input'],['hero.scroll','向下引导','input'],['hero.bottom','底部说明','input']]},
    {title:'精选作品区',fields:[['work.eyebrow','栏目编号 / 小标题','input'],['work.title','大标题','textarea'],['work.intro','栏目介绍','textarea']]},
    {title:'创作观点',fields:[['philosophy.eyebrow','栏目编号 / 小标题','input'],['philosophy.line1','第一行','input'],['philosophy.line2','第二行','input'],['philosophy.line3','荧光强调行','input'],['philosophy.body','说明文字','textarea']]},
    {title:'我的实践',fields:[['expertise.eyebrow','栏目编号 / 小标题','input'],['expertise.title','大标题','textarea'],['expertise.intro','介绍文字','textarea'],['expertise.items.0','能力 01','input'],['expertise.items.1','能力 02','input'],['expertise.items.2','能力 03','input'],['expertise.items.3','能力 04','input']]},
    {title:'关于我',fields:[['about.eyebrow','栏目编号 / 小标题','input'],['about.title','大标题','textarea'],['about.body','个人介绍','textarea'],['about.noteLeft','底部左侧文字','input'],['about.noteRight','底部右侧文字','input']]},
    {title:'联系信息',fields:[['contact.eyebrow','栏目编号 / 小标题','input'],['contact.title','联系大标题','input'],['contact.lead','联系说明','textarea'],['contact.email','邮箱','input'],['contact.behance','Behance 链接','input'],['contact.instagram','Instagram 链接','input']]},
    {title:'导航与页脚',fields:[['nav.work','导航：作品','input'],['nav.approach','导航：方法','input'],['nav.about','导航：关于','input'],['nav.contact','导航：联系','input'],['nav.status','合作状态','input'],['footer.left','页脚左侧','input'],['footer.center','页脚中间','input'],['footer.top','返回顶部','input']]}
  ];
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
  function get(path){return String(path).split('.').reduce((o,k)=>o?.[k],draft)}
  function set(path,value,{preview=true}={}){const a=String(path).split('.');let o=draft;a.slice(0,-1).forEach(k=>o=o[k]);o[a.at(-1)]=value;if(preview)sendPreview();markDirty()}
  function fieldHtml([path,label,type]){const v=get(path);return `<div class="field"><label>${esc(label)}</label>${type==='textarea'?`<textarea data-path="${path}">${esc(v)}</textarea>`:`<input data-path="${path}" value="${esc(v)}">`}</div>`}
  function heroImageHtml(){return `<details class="group" open><summary>首屏主图</summary><div class="group-body"><div class="hint">默认主图为原创暗黑 3D 视觉。你可以上传自己拥有使用权的图片直接替换；发布时会自动上传到 GitHub。</div><div class="hero-upload"><img class="hero-thumb" id="heroThumb" src="${esc(draft.design.heroImage)}" alt="首屏主图预览"><label class="upload-label">上传 / 替换首屏主图<input type="file" accept="image/*" id="heroUpload"></label></div></div></details>`}
  function inspectorHtml(){return `<div class="selection-panel" id="selectionInspector"><div class="selection-empty"><strong style="color:#f0eee7">直接编辑模式</strong><br>在左侧预览里点击任意可编辑文字，然后可以修改字体、字号、行高、字间距；按住文字拖动即可调整位置，靠近其它元素或页面中线时会自动吸附。</div></div>`}
  function renderForm(){
    const host=$('#form');
    host.innerHTML=inspectorHtml()+heroImageHtml()+`<details class="group" open><summary>首页大标题</summary><div class="group-body"><div class="hint">为了保留中间描边字的视觉效果，大标题拆成 3 个字。默认是“作 / 品 / 集”。</div><div class="triple">${fieldHtml(['hero.titleBefore','第 1 个字','input'])}${fieldHtml(['hero.titleOutline','描边字','input'])}${fieldHtml(['hero.titleAfter','第 3 个字','input'])}</div></div></details>`+groups.map((g,i)=>`<details class="group" ${i<2?'open':''}><summary>${g.title}</summary><div class="group-body">${g.hint?`<div class="hint">${g.hint}</div>`:''}${g.fields.map(fieldHtml).join('')}</div></details>`+(i===1?projectsHtml():'')).join('')+`<div class="publish-note"><b>保存机制：</b>文字、字体参数、拖动位置和图片都会保存在 <code>content.js</code> / <code>assets/uploads/</code> 中。点击“保存并发布”后直接提交到 GitHub，Pages 会自动重新发布。</div>`;
    bindFields();bindUploads();bindHeroUpload(); if(selected)renderInspector(selected);
  }
  function projectsHtml(){return `<details class="group" open><summary>作品内容与图片</summary><div class="group-body"><div class="hint">可以修改 6 个项目的标题、分类、年份、介绍和封面。上传图片后，左侧会立即预览；只有点击“保存并发布”才真正上传。</div>${draft.projects.map((p,i)=>`<div class="project-card"><h3><span>项目 ${String(i+1).padStart(2,'0')}</span><span>${esc(p.name)}</span></h3><div class="image-control"><img class="thumb" id="thumb-${i}" src="${esc(p.image)}" alt=""><label class="upload-label">替换封面图片<input type="file" accept="image/*" data-upload="${i}"></label></div>${fieldHtml([`projects.${i}.name`,'项目名称','input'])}<div class="row">${fieldHtml([`projects.${i}.type`,'类型 / 标签','input'])}${fieldHtml([`projects.${i}.year`,'年份','input'])}</div><div class="field"><label>所属分类</label><select data-path="projects.${i}.category"><option value="identity" ${p.category==='identity'?'selected':''}>视觉识别</option><option value="digital" ${p.category==='digital'?'selected':''}>数字体验</option><option value="experimental" ${p.category==='experimental'?'selected':''}>实验创作</option></select></div>${fieldHtml([`projects.${i}.description`,'项目介绍','textarea'])}<div class="field"><label>详情标签（用中文逗号或英文逗号分隔）</label><input data-tags="${i}" value="${esc(p.tags.join('，'))}"></div></div>`).join('')}</div></details>`}
  function bindFields(){$$('[data-path]').forEach(el=>el.addEventListener('input',()=>set(el.dataset.path,el.value)));$$('[data-tags]').forEach(el=>el.addEventListener('input',()=>{const i=+el.dataset.tags;draft.projects[i].tags=el.value.split(/[，,]/).map(x=>x.trim()).filter(Boolean);sendPreview();markDirty()}))}
  function bindUploads(){$$('[data-upload]').forEach(el=>el.addEventListener('change',async()=>{const file=el.files?.[0];if(!file)return;const i=+el.dataset.upload,dataUrl=await fileToDataUrl(file);pendingUploads.set(i,{file,dataUrl});draft.projects[i].image=dataUrl;$('#thumb-'+i).src=dataUrl;sendPreview();markDirty('有图片尚未发布')}))}
  function bindHeroUpload(){const el=$('#heroUpload');if(!el)return;el.addEventListener('change',async()=>{const file=el.files?.[0];if(!file)return;const dataUrl=await fileToDataUrl(file);pendingHeroUpload={file,dataUrl};draft.design.heroImage=dataUrl;$('#heroThumb').src=dataUrl;sendPreview();markDirty('首屏主图尚未发布')})}
  function fontOptions(value){const opts=[['','跟随网站默认'],['Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif','现代无衬线'],['"PingFang SC", "Microsoft YaHei", sans-serif','苹方 / 微软雅黑'],['"Noto Sans SC", "PingFang SC", sans-serif','Noto Sans SC'],['"Songti SC", "SimSun", serif','宋体'],['"Kaiti SC", "KaiTi", serif','楷体'],['Arial, sans-serif','Arial'],['"Times New Roman", serif','Times New Roman'],['ui-monospace, SFMono-Regular, Menlo, Consolas, monospace','等宽字体']];return opts.map(([v,n])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${n}</option>`).join('')}
  function renderInspector(info){
    selected=info;const box=$('#selectionInspector');if(!box)return;
    const style=draft.design.elementStyles[info.key]||{},off=draft.design.elementOffsets[info.key]||info.offset||{x:0,y:0};
    const effectiveSize=Math.round(info.style?.fontSize||16),effectiveLine=Math.round(((info.style?.lineHeight||effectiveSize*1.3)/effectiveSize)*100)/100,effectiveLetter=Math.round((info.style?.letterSpacing||0)*100)/100;
    box.innerHTML=`<div class="selection-head"><b>正在编辑选中文字</b><span>${esc(info.key)}</span></div><div class="selection-body"><div class="field"><label>文字内容</label><textarea id="selectedText">${esc(get(info.key)??'')}</textarea></div><div class="field"><label>字体 / 字号 / 行高 / 字间距</label><div class="control-grid four"><select id="fontFamily">${fontOptions(style.fontFamily||'')}</select><input id="fontSize" type="number" min="8" max="420" step="1" value="${esc(style.fontSize??effectiveSize)}" title="字号 px"><input id="lineHeight" type="number" min="0.6" max="4" step="0.05" value="${esc(style.lineHeight??effectiveLine)}" title="行高"><input id="letterSpacing" type="number" min="-20" max="80" step="0.1" value="${esc(style.letterSpacing??effectiveLetter)}" title="字间距 px"></div><div class="hint" style="margin:7px 0 0">依次为：字体、字号(px)、行高(倍数)、字间距(px)</div></div><div class="field"><label>位置偏移（也可以直接在左侧拖动）</label><div class="position-grid"><input id="offsetX" type="number" step="1" value="${+off.x||0}" title="X"><input id="offsetY" type="number" step="1" value="${+off.y||0}" title="Y"><button class="inline-btn" id="resetPosition">恢复位置</button></div></div><div class="row"><button class="inline-btn" id="resetType">恢复默认排版</button><button class="inline-btn" id="locateSelected">重新选中元素</button></div><div class="editor-tip"><strong>拖动：</strong>左侧按住文字移动，默认按 8px 网格吸附；靠近其它文字边缘、中心线或页面容器边界时会出现荧光辅助线。</div></div>`;
    $('#selectedText').addEventListener('input',e=>set(info.key,e.target.value));
    const updateStyle=()=>{draft.design.elementStyles[info.key]={fontFamily:$('#fontFamily').value,fontSize:+$('#fontSize').value,lineHeight:+$('#lineHeight').value,letterSpacing:+$('#letterSpacing').value};sendPreview();markDirty()};
    ['fontFamily','fontSize','lineHeight','letterSpacing'].forEach(id=>$('#'+id).addEventListener('input',updateStyle));
    const updatePos=()=>{draft.design.elementOffsets[info.key]={x:+$('#offsetX').value||0,y:+$('#offsetY').value||0};sendPreview();markDirty()};$('#offsetX').addEventListener('input',updatePos);$('#offsetY').addEventListener('input',updatePos);
    $('#resetPosition').onclick=()=>{delete draft.design.elementOffsets[info.key];$('#offsetX').value=0;$('#offsetY').value=0;sendPreview();markDirty()};
    $('#resetType').onclick=()=>{delete draft.design.elementStyles[info.key];sendPreview();markDirty();setTimeout(()=>$('#previewFrame').contentWindow.postMessage({type:'portfolio-select-key',key:info.key},'*'),40)};
    $('#locateSelected').onclick=()=>$('#previewFrame').contentWindow.postMessage({type:'portfolio-select-key',key:info.key},'*');
  }
  function sendPreview(){if(frameReady)$('#previewFrame').contentWindow.postMessage({type:'portfolio-preview',content:draft},'*')}
  function markDirty(msg='有未发布修改'){$('#saveState').textContent=msg;$('#saveState').style.color='#d9ff55'}
  function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
  $('#previewFrame').addEventListener('load',()=>{frameReady=true;sendPreview()});
  $$('[data-view]').forEach(b=>b.addEventListener('click',()=>{$$('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#frameShell').className='frame-shell '+(b.dataset.view==='desktop'?'':b.dataset.view)}));
  window.addEventListener('message',e=>{
    if(e.source!==$('#previewFrame').contentWindow)return;
    if(e.data?.type==='portfolio-select'){selected=e.data;renderInspector(selected);$('.editor').scrollTo({top:0,behavior:'smooth'})}
    if(e.data?.type==='portfolio-layout-change'){
      const {key,offset}=e.data;draft.design.elementOffsets[key]=offset;markDirty();
      if(selected?.key===key){selected.offset=offset;const x=$('#offsetX'),y=$('#offsetY');if(x)x.value=offset.x;if(y)y.value=offset.y}
    }
  });
  function fillSettings(){$('#ghOwner').value=config.owner;$('#ghRepo').value=config.repo;$('#ghBranch').value=config.branch;$('#siteUrl').value=config.siteUrl;$('#ghToken').value=config.token}
  function openSettings(){fillSettings();$('#settingsModal').classList.add('open')}
  function closeSettings(){$('#settingsModal').classList.remove('open')}
  $('#settingsBtn').onclick=openSettings;$('#closeSettings').onclick=closeSettings;$('#cancelSettings').onclick=closeSettings;$('#settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeSettings()});
  $('#saveSettings').onclick=()=>{config.owner=$('#ghOwner').value.trim();config.repo=$('#ghRepo').value.trim();config.branch=$('#ghBranch').value.trim()||'main';config.siteUrl=$('#siteUrl').value.trim();config.token=$('#ghToken').value.trim();localStorage.setItem('portfolio-gh-owner',config.owner);localStorage.setItem('portfolio-gh-repo',config.repo);localStorage.setItem('portfolio-gh-branch',config.branch);localStorage.setItem('portfolio-site-url',config.siteUrl);sessionStorage.setItem('portfolio-gh-token',config.token);closeSettings();toast('GitHub 连接信息已保存到当前浏览器')};
  $('#openSite').onclick=()=>window.open(config.siteUrl||'index.html','_blank');
  function readyConfig(){return config.owner&&config.repo&&config.branch&&config.token}
  async function gh(path,opt={}){const res=await fetch('https://api.github.com'+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+config.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...(opt.headers||{})}});if(!res.ok){let detail='';try{detail=(await res.json()).message||''}catch{}throw new Error(`GitHub 请求失败（${res.status}）${detail?'：'+detail:''}`)}return res.status===204?null:res.json()}
  function safeName(name){const dot=name.lastIndexOf('.'),ext=dot>-1?name.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g,''):'';const base=(dot>-1?name.slice(0,dot):name).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'image';return base+ext}
  function bufferToBase64(buf){const bytes=new Uint8Array(buf);let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(out)}
  function textToBase64(s){return bufferToBase64(new TextEncoder().encode(s).buffer)}
  async function putNewFile(path,file,message){const base64=bufferToBase64(await file.arrayBuffer());await gh(`/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${path}`,{method:'PUT',body:JSON.stringify({message,content:base64,branch:config.branch})});return path}
  async function uploadPending(){
    if(pendingHeroUpload){$('#saveState').textContent='正在上传首屏主图…';const path=`assets/uploads/${Date.now()}-hero-${safeName(pendingHeroUpload.file.name)}`;await putNewFile(path,pendingHeroUpload.file,'更新首屏主图');draft.design.heroImage=path;$('#heroThumb').src=path;pendingHeroUpload=null}
    for(const [i,item] of pendingUploads){$('#saveState').textContent=`正在上传项目 ${i+1} 图片…`;const path=`assets/uploads/${Date.now()}-${i+1}-${safeName(item.file.name)}`;await putNewFile(path,item.file,`更新作品图片：${draft.projects[i].name}`);draft.projects[i].image=path;$('#thumb-'+i).src=path;await new Promise(r=>setTimeout(r,15))}pendingUploads.clear();
  }
  async function publishContent(){const api=`/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/content.js`;const current=await gh(api+`?ref=${encodeURIComponent(config.branch)}`);const output='window.PORTFOLIO_CONTENT = '+JSON.stringify(draft,null,2)+';\n';await gh(api,{method:'PUT',body:JSON.stringify({message:'通过 Portfolio Studio 更新网站',content:textToBase64(output),sha:current.sha,branch:config.branch})})}
  $('#publishBtn').onclick=async()=>{if(!readyConfig()){openSettings();toast('首次发布前需要连接 GitHub 仓库');return}const btn=$('#publishBtn');btn.disabled=true;btn.textContent='正在发布…';try{await uploadPending();sendPreview();$('#saveState').textContent='正在写入网站内容…';await publishContent();$('#saveState').textContent='已提交到 GitHub，Pages 将自动更新';$('#saveState').style.color='#9cff9c';btn.textContent='已发布 ✓';toast('发布成功：修改已经提交到 GitHub');setTimeout(()=>btn.textContent='保存并发布',2200)}catch(err){console.error(err);$('#saveState').textContent='发布失败：'+err.message;$('#saveState').style.color='#ff7b73';btn.textContent='保存并发布';toast(err.message)}finally{btn.disabled=false}};
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
  renderForm();
})();
</script>
</body>
</html>
